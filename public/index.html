<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <!-- viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- primary SEO -->
    <title>Oslo — Where Nature Meets Nordic Luxury</title>
    <meta
        name="description"
        content="Discover Oslo through nature, architecture, and Nordic luxury. A curated digital experience of Norway's capital."
    />

    <!-- theme -->
    <meta name="theme-color" content="#111315" />

    <!-- canonical url -->
    <link rel="canonical" href="https://pguinness.github.io/oslo/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oslo — Where Nature Meets Nordic Luxury" />
    <meta
        property="og:description"
        content="A calm digital journey through Oslo, where forests, fjords, and modern Nordic design meet."
    />
    <meta property="og:url" content="https://pguinness.github.io/oslo/" />
    <meta property="og:image" content="https://pguinness.github.io/oslo/og.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- icons -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
</head>
<body>
    <noscript>
        This experience requires JavaScript to explore Oslo's landscapes and city life.
    </noscript>
    <div id="root"></div>
</body>
</html>
